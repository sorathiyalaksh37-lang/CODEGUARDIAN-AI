services:

  backend:
    build: .

    container_name: codeguardian-backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/node_modules

    env_file:
      - .env

    depends_on:
      - redis

    restart: always

  redis:
    image: redis:latest

    container_name: codeguardian-redis

    ports:
      - "6380:6379"

    restart: always